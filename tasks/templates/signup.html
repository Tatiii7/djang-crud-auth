<form action="/signup/" method="POST">

    {% csrf_token %}
   
    <div class="container center" style="margin-top: 100px;">

        {{form.as_p}}
        
        <a href="{% url 'generos' %}" class="btn waves-effect waves-light deep-purple lighten-1 btn-large oval-button">Sign Up</a>
        
    {% endblock %}

</form>
